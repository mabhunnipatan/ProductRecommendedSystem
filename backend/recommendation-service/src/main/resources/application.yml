server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/recommendation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  application:
    name: recommendation-service

jwt:
  secret: ecommerce-secret-key-for-jwt-auth-2024-very-long-secret-key-must-be-256-bits
  expiration: 86400000

services:
  product-service: http://localhost:8082
