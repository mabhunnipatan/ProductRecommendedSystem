server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "Authorization"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**, /api/categories/**
          filters:
            - name: JwtAuthFilter

        - id: cart-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/cart/**, /api/wishlist/**
          filters:
            - name: JwtAuthFilter

        - id: recommendation-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/recommendations/**, /api/ai/**
          filters:
            - name: JwtAuthFilter

jwt:
  secret: ecommerce-secret-key-for-jwt-auth-2024-very-long-secret-key-must-be-256-bits
  expiration: 86400000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.ecommerce: DEBUG
